 • WAF • DNS</text><rect x="455" y="315" width="370" height="125" rx="12" fill="#e7f4e8" stroke="#4b8b52" stroke-width="2"/><text x="640" y="346" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#245e2b">Application &amp; Compute</text><text x="640" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">Compute Instances • Instance Pools</text><text x="640" y="399" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">OKE • OCI Functions • API Gateway</text><text x="640" y="421" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">OCI DevOps • Container Registry</text><rect x="860" y="315" width="370" height="125" rx="12" fill="#fff0db" stroke="#c78826" stroke-width="2"/><text x="1045" y="346" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#845711">Data &amp; Integration</text><text x="1045" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">Object / Block / File Storage</text><text x="1045" y="399" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">Autonomous DB • Exadata • MySQL HeatWave</text><text x="1045" y="421" text-anchor="middle" font-family="Arial" font-size="14" fill="#243746">Streaming • Queue • Events • Integration</text><path d="M640 265V287H235V315 M640 287V315 M640 287H1045V315" stroke="#65758b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="55" y="500" width="555" height="110" rx="12" fill="#fff" stroke="#d6d8dc" stroke-width="2"/><text x="332" y="531" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#312d2a">Observability &amp; Governance</text><text x="332" y="558" text-anchor="middle" font-family="Arial" font-size="14" fill="#444">Monitoring • Alarms • Logging • Logging Analytics</text><text x="332" y="583" text-anchor="middle" font-family="Arial" font-size="14" fill="#444">Cloud Advisor • Usage Reports • Budgets</text><rect x="665" y=